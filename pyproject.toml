[project]
name = "insider-threat"
version = "0.1.0"
description = "Insider threat detection analyses over the CERT Insider Threat Dataset (r4.2)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Nilson Sangy" }]
dependencies = [
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insider_threat"]

[tool.pytest.ini_options]
# src/ to import the `insider_threat` package; "." to import the `analyses` package.
pythonpath = ["src", "."]
testpaths = ["tests"]
