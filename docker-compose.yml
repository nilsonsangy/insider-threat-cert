# Local analysis environment: OpenSearch and OpenSearch Dashboards.
# Usage: copy .env.example to .env, then `docker compose up -d`.
# Security is disabled for local use only. Do not use this setup in production.
services:
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:?copy .env.example to .env}
    container_name: cert-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:?copy .env.example to .env} -Xmx${OPENSEARCH_HEAP:?copy .env.example to .env}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "${OPENSEARCH_PORT:?copy .env.example to .env}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION:?copy .env.example to .env}
    container_name: cert-opensearch-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:?copy .env.example to .env}:5601"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
