# docker-compose for the insider-threat-cert project.
#
#   docker compose up -d app                   -> start the analysis container (Python/pandas)
#   docker compose run --rm app ...            -> run a command in the container
#   docker compose --profile opensearch up -d  -> also start OpenSearch + Dashboards
#
# The OpenSearch services live under the `opensearch` profile: the default `up`
# does NOT start them, and the analyses/tests do not depend on them.

services:
  # Default service (Python + pandas). Run commands with
  # `docker compose run --rm app ...`.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: insider-threat-cert
    working_dir: /app
    # Bind mount of the repository for development (local edits show up in the container).
    volumes:
      - .:/app
      # Anonymous volume keeps the image's .venv on top of the bind mount above.
      - /app/.venv
    # No ports: the pandas path is offline.
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # OPTIONAL: explore the CSVs visually. Only starts with `--profile opensearch`.
  # Minimal development setup (single-node, security plugin off).
  # DO NOT use in production: security is disabled for local convenience.
  # ---------------------------------------------------------------------------
  opensearch:
    profiles: ["opensearch"]
    image: opensearchproject/opensearch:2.17.1
    container_name: cert-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Disable the security plugin for easy local access.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    profiles: ["opensearch"]
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: cert-opensearch-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      # Dashboards also with the security plugin disabled (matches the service above).
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      - opensearch

volumes:
  opensearch-data:
